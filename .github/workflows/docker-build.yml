name: Docker Build (Backend)

on:
  pull_request:
    branches: [Production, development]
    paths:
      - "BE/**"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [Production]
    paths:
      - "BE/**"

jobs:
  build:
    name: Verify backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: false
          load: true
          tags: connectlocal-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container starts and /health responds
        run: |
          docker run -d --name api \
            -e EVENTFINDA_USERNAME=test \
            -e EVENTFINDA_PASSWORD=test \
            -e TICKETMASTER_API_KEY=test \
            -e GOOGLE_MAPS_API_KEY=test \
            -e DATABASE_URL_SYNC=sqlite:///:memory: \
            -e DATABASE_URL=sqlite:///:memory: \
            -e ENVIRONMENT=test \
            -p 8000:8000 \
            connectlocal-backend:ci

          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "GOOD /health responded on attempt $i"
              docker logs api
              exit 0
            fi
            sleep 1
          done

          echo "BAD /health did not respond within 30s"
          docker logs api
          exit 1
